<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wabisabi Homestay</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,750&display=swap">
<style>
/* Layout: a reception "room rack" — sticky top bar + tabs, then apartments × days timeline as the main surface; finance = statement beside 12-month chart, then per-apartment table. */
:root {
  --bg: #F2F5F3; --surface: #FFFFFF; --surface-2: #F7FAF8; --ink: #13211E; --ink-2: #475753; --muted: #75847F;
  --line: #D9E1DD; --line-2: #E9EEEB; --axis: #BFC9C4; --grid: #E4EAE7;
  --accent: #0C6A61; --accent-ink: #FFFFFF; --accent-soft: #DCEFEA;
  --weekend: #F0F4F1; --today-wash: #E3F2EE;
  --st-hold: #F5C531; --st-hold-2: #F9DA75; --st-hold-ink: #3A2E00;
  --st-deposit: #F28A2B; --st-deposit-ink: #2C1400;
  --st-paid: #D6393B; --st-paid-ink: #FFFFFF;
  --st-owner: #8452DE; --st-owner-ink: #FFFFFF;
  --pos: #0B7A3B; --neg: #C2302F;
  --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a;
  --scrim: rgba(8, 18, 16, .45);
  --shadow: 0 1px 2px rgba(19,33,30,.06), 0 12px 32px rgba(19,33,30,.14);
  --f-display: "Bricolage Grotesque", "Be Vietnam Pro", system-ui, sans-serif;
  --f-body: "Be Vietnam Pro", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --r: 10px; --namew: 196px; --dayw: 38px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0D1412; --surface: #141D1B; --surface-2: #19241F; --ink: #E3ECE8; --ink-2: #A7B6B1; --muted: #7E8E89;
    --line: #27332F; --line-2: #1E2926; --axis: #3A4844; --grid: #222E2A;
    --accent: #4DB6A8; --accent-ink: #052420; --accent-soft: #163933;
    --weekend: #17211E; --today-wash: #173430;
    --st-hold: #E2B62C; --st-hold-2: #C99E1C; --st-hold-ink: #241C00;
    --st-deposit: #E7812A; --st-deposit-ink: #200E00;
    --st-paid: #E04B4B; --st-paid-ink: #FFFFFF;
    --st-owner: #9466EC; --st-owner-ink: #FFFFFF;
    --pos: #3CC37A; --neg: #F06A68;
    --s1: #3987e5; --s2: #d95926; --s3: #199e70;
    --scrim: rgba(0,0,0,.6);
    --shadow: 0 1px 2px rgba(0,0,0,.4), 0 12px 32px rgba(0,0,0,.5);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0D1412; --surface: #141D1B; --surface-2: #19241F; --ink: #E3ECE8; --ink-2: #A7B6B1; --muted: #7E8E89;
  --line: #27332F; --line-2: #1E2926; --axis: #3A4844; --grid: #222E2A;
  --accent: #4DB6A8; --accent-ink: #052420; --accent-soft: #163933;
  --weekend: #17211E; --today-wash: #173430;
  --st-hold: #E2B62C; --st-hold-2: #C99E1C; --st-hold-ink: #241C00;
  --st-deposit: #E7812A; --st-deposit-ink: #200E00;
  --st-paid: #E04B4B; --st-paid-ink: #FFFFFF;
  --st-owner: #9466EC; --st-owner-ink: #FFFFFF;
  --pos: #3CC37A; --neg: #F06A68;
  --s1: #3987e5; --s2: #d95926; --s3: #199e70;
  --scrim: rgba(0,0,0,.6);
  --shadow: 0 1px 2px rgba(0,0,0,.4), 0 12px 32px rgba(0,0,0,.5);
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font: 14px/1.5 var(--f-body); -webkit-font-smoothing: antialiased; }
body.noscroll { overflow: hidden; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
h1, h2, h3, h4 { text-wrap: balance; }
.app { max-width: 1320px; margin: 0 auto; padding-inline: 16px; padding-block: 0 56px; }

/* top bar */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--bg); display: flex; align-items: center; gap: 12px; padding-block: 14px 10px; flex-wrap: wrap; }
.brand { font-family: var(--f-display); font-weight: 750; font-size: 22px; letter-spacing: -.015em; display: flex; align-items: center; gap: 10px; }
.mark { width: 30px; height: 30px; border-radius: 8px; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; }
.role { font-size: 12px; padding: 3px 10px; border-radius: 999px; background: var(--accent-soft); color: var(--accent); font-weight: 600; letter-spacing: .02em; }
.spacer { flex: 1; }
.tabs { display: flex; gap: 2px; overflow-x: auto; border-bottom: 1px solid var(--line); margin-bottom: 18px; scrollbar-width: none; }
.tab { appearance: none; border: 0; background: none; padding: 10px 14px; font-weight: 600; color: var(--ink-2); border-bottom: 2px solid transparent; cursor: pointer; white-space: nowrap; margin-bottom: -1px; }
.tab:hover { color: var(--ink); }
.tab[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); }

/* controls */
.btn { appearance: none; border: 1px solid var(--line); background: var(--surface); padding: 7px 12px; border-radius: 8px; font-weight: 600; font-size: 13.5px; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; color: var(--ink); }
.btn:hover { border-color: var(--axis); }
.btn:disabled { opacity: .55; cursor: default; }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.ghost { background: transparent; border-color: transparent; color: var(--ink-2); }
.btn.ghost:hover { background: var(--surface); border-color: var(--line); }
.btn.danger { color: var(--neg); }
.btn.icon { padding: 7px 8px; }
.btn svg, .tab svg { flex: none; }
.toolbar { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 12px; margin-bottom: 14px; }
.nav { display: flex; align-items: center; gap: 4px; }
.nav h2 { font-family: var(--f-display); font-size: 20px; font-weight: 600; margin: 0 6px; min-width: 148px; text-align: center; letter-spacing: -.01em; }
.chips { display: inline-flex; gap: 2px; background: var(--surface); border: 1px solid var(--line); border-radius: 9px; padding: 3px; }
.chip { border: 0; background: none; padding: 5px 10px; border-radius: 6px; font-weight: 600; color: var(--ink-2); cursor: pointer; font-size: 13px; white-space: nowrap; }
.chip[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent); }
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 12.5px; color: var(--ink-2); }
.legend span { display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
.sw { width: 16px; height: 11px; border-radius: 3px; display: inline-block; flex: none; }
.st-hold { background: repeating-linear-gradient(135deg, var(--st-hold) 0 7px, var(--st-hold-2) 7px 11px); color: var(--st-hold-ink); }
.st-deposit { background: var(--st-deposit); color: var(--st-deposit-ink); }
.st-paid { background: var(--st-paid); color: var(--st-paid-ink); }
.st-owner { background: var(--st-owner); color: var(--st-owner-ink); }
.strip { display: flex; flex-wrap: wrap; gap: 4px 18px; margin: -4px 0 12px; font-size: 13px; color: var(--ink-2); }
.strip b { color: var(--ink); font-weight: 600; }
.hint { color: var(--muted); font-size: 12.5px; margin: 8px 2px 18px; }

/* timeline (room rack) */
.tl-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); }
.tl { min-width: calc(var(--namew) + var(--n) * var(--dayw)); }
.tl-head, .tl-row { display: grid; grid-template-columns: var(--namew) repeat(var(--n), var(--dayw)); }
.tl-row { grid-template-rows: 48px; border-top: 1px solid var(--line-2); }
.tl-corner, .tl-name { position: sticky; left: 0; z-index: 3; background: var(--surface); border-right: 1px solid var(--line); min-width: 0; }
.tl-corner { padding: 6px 12px; font-size: 12px; color: var(--muted); display: flex; align-items: flex-end; }
.tl-name { grid-row: 1; grid-column: 1; padding: 4px 12px; display: flex; flex-direction: column; justify-content: center; }
.tl-name b { font-size: 13px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tl-name small { color: var(--muted); font-size: 11.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tl-day { text-align: center; padding: 6px 0 5px; font-size: 10.5px; color: var(--muted); border-left: 1px solid var(--line-2); letter-spacing: .03em; }
.tl-day b { display: block; font-size: 13px; color: var(--ink); font-weight: 600; width: 26px; margin: 1px auto 0; border-radius: 6px; font-variant-numeric: tabular-nums; }
.tl-day.we { background: var(--weekend); }
.tl-day.td b { background: var(--accent); color: var(--accent-ink); }
.tl-cell { grid-row: 1; border: 0; border-left: 1px solid var(--line-2); background: transparent; padding: 0; margin: 0; }
.tl-cell.we { background: var(--weekend); }
.tl-cell.td { background: var(--today-wash); }
button.tl-cell { cursor: pointer; }
button.tl-cell:hover { background: var(--accent-soft); }
.tl-bar { grid-row: 1; z-index: 2; align-self: center; height: 30px; margin-inline: calc(var(--dayw) / 2 + 1px); border: 0; border-radius: 7px; padding: 0 8px; font-size: 12px; font-weight: 600; line-height: 30px; text-align: left; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; min-width: 0; box-shadow: 0 0 0 2px var(--surface); }
button.tl-bar { cursor: pointer; }
button.tl-bar:hover { filter: brightness(1.06); }
.tl-bar.cl { margin-left: 0; border-top-left-radius: 0; border-bottom-left-radius: 0; }
.tl-bar.cr { margin-right: 0; border-top-right-radius: 0; border-bottom-right-radius: 0; }

/* cards & layout */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px 18px; min-width: 0; }
.card h3 { font-family: var(--f-display); font-weight: 600; font-size: 17px; margin: 0 0 12px; letter-spacing: -.005em; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.card h3 small { font-family: var(--f-body); font-weight: 500; font-size: 12.5px; color: var(--muted); }
.stack { display: grid; gap: 16px; }
.cols { display: grid; grid-template-columns: minmax(0, 5fr) minmax(0, 7fr); gap: 16px; }
.cols.even { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
@media (max-width: 900px) { .cols, .cols.even { grid-template-columns: minmax(0, 1fr); } }
.empty { text-align: center; padding: 40px 20px; color: var(--ink-2); }
.empty h3 { justify-content: center; font-size: 19px; margin-bottom: 6px; color: var(--ink); }
.empty p { max-width: 52ch; margin: 0 auto 16px; }
.note { font-size: 13px; color: var(--ink-2); background: var(--surface-2); border: 1px solid var(--line-2); border-radius: 8px; padding: 10px 12px; }
.note b { color: var(--ink); }
.warn { border-color: color-mix(in srgb, var(--st-deposit) 45%, var(--line)); }
ol.steps { margin: 0; padding-left: 20px; display: grid; gap: 6px; font-size: 13.5px; color: var(--ink-2); }
ol.steps b { color: var(--ink); }

/* upcoming */
.up { display: grid; grid-template-columns: minmax(0,1fr) minmax(0,1fr); gap: 16px; }
@media (max-width: 700px) { .up { grid-template-columns: minmax(0,1fr); } }
.up ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; }
.up li { display: grid; grid-template-columns: 78px 12px minmax(0, 1fr) auto; gap: 8px; align-items: center; padding: 6px 4px; border-bottom: 1px solid var(--line-2); font-size: 13px; }
.up li:last-child { border-bottom: 0; }
.up .d { color: var(--ink-2); font-size: 12px; font-weight: 600; }
.up .who { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.up .who small { color: var(--muted); }
.up .dot { width: 10px; height: 10px; border-radius: 3px; }
.up .nil { color: var(--muted); font-size: 13px; padding: 6px 4px; }

/* KPI tiles */
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(168px, 1fr)); gap: 10px; margin-bottom: 16px; }
.kpi { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 12px 14px; min-width: 0; }
.kpi .l { font-size: 12.5px; color: var(--ink-2); }
.kpi .v { font-size: 22px; font-weight: 700; letter-spacing: -.01em; line-height: 1.3; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.kpi .v small { font-size: 13px; font-weight: 600; color: var(--muted); }
.kpi .d { font-size: 12px; color: var(--muted); }
.kpi.hero { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.kpi.hero .l, .kpi.hero .d, .kpi.hero .v small { color: inherit; opacity: .85; }
.pos { color: var(--pos); } .neg { color: var(--neg); }
.kpi.hero .pos, .kpi.hero .neg { color: inherit; }

/* statement */
.stmt { display: grid; font-size: 13.5px; }
.stmt .r { display: grid; grid-template-columns: minmax(0,1fr) auto 58px; gap: 10px; padding: 6px 2px; border-bottom: 1px solid var(--line-2); align-items: baseline; }
.stmt .r > span:nth-child(2), .stmt .r > span:nth-child(3) { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
.stmt .r > span:nth-child(3) { color: var(--muted); font-size: 12px; }
.stmt .sub > span:first-child { padding-left: 14px; color: var(--ink-2); }
.stmt .sum { font-weight: 700; border-bottom-color: var(--line); }
.stmt .grand { font-weight: 700; font-size: 15px; border-top: 1.5px solid var(--ink); border-bottom: 3px double var(--ink); margin-top: 2px; }

/* tables */
.tscroll { overflow-x: auto; margin: 0 -4px; }
table.t { width: 100%; border-collapse: collapse; font-size: 13px; }
.t th, .t td { padding: 8px 10px; text-align: left; border-bottom: 1px solid var(--line-2); white-space: nowrap; }
.t th { font-size: 11.5px; color: var(--ink-2); font-weight: 600; background: var(--surface-2); letter-spacing: .02em; }
.t .n { text-align: right; font-variant-numeric: tabular-nums; }
.t tr.total td { font-weight: 700; border-top: 1.5px solid var(--ink); border-bottom: 0; }
.t tr.muted td { color: var(--ink-2); }
.t tbody tr.click { cursor: pointer; }
.t tbody tr.click:hover td { background: var(--surface-2); }
.t td.name { max-width: 240px; overflow: hidden; text-overflow: ellipsis; }
.t td small { color: var(--muted); }
.meter { display: inline-grid; grid-template-columns: 44px 36px; align-items: center; gap: 6px; }
.meter i { height: 6px; border-radius: 3px; background: var(--accent-soft); position: relative; overflow: hidden; display: block; }
.meter i::after { content: ""; position: absolute; inset: 0 auto 0 0; width: var(--w); background: var(--accent); border-radius: 3px; }
.tag { display: inline-block; font-size: 11.5px; font-weight: 600; padding: 1px 8px; border-radius: 999px; background: var(--surface-2); border: 1px solid var(--line); color: var(--ink-2); }
.tag.l { background: var(--accent-soft); border-color: transparent; color: var(--accent); }
.tag.s { border-style: dashed; }

/* charts */
.chart { position: relative; min-height: 260px; }
.chart svg { display: block; }
.chart text { font-family: var(--f-body); font-size: 11px; fill: var(--muted); font-variant-numeric: tabular-nums; }
.ckey { display: flex; flex-wrap: wrap; gap: 4px 16px; font-size: 12.5px; color: var(--ink-2); margin-bottom: 8px; }
.ckey span { display: inline-flex; align-items: center; gap: 6px; }
.ckey i { width: 10px; height: 10px; border-radius: 3px; display: inline-block; }
.ckey i.ln { width: 16px; height: 2px; border-radius: 1px; }
.tip { position: absolute; pointer-events: none; background: var(--surface); border: 1px solid var(--line); box-shadow: var(--shadow); border-radius: 8px; padding: 8px 10px; font-size: 12.5px; min-width: 170px; z-index: 5; }
.tip b { display: block; margin-bottom: 4px; }
.tip div { display: flex; justify-content: space-between; gap: 12px; font-variant-numeric: tabular-nums; }
.tip i { width: 8px; height: 8px; border-radius: 2px; display: inline-block; margin-right: 6px; }
.hbars { display: grid; gap: 8px; }
.hb { display: grid; grid-template-columns: minmax(110px, 38%) minmax(0, 1fr) auto; gap: 10px; align-items: center; font-size: 13px; }
.hb span:first-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--ink-2); }
.hb i { height: 10px; border-radius: 0 4px 4px 0; background: var(--s2); display: block; min-width: 2px; }
.hb b { font-weight: 600; font-variant-numeric: tabular-nums; font-size: 12.5px; }

/* board */
.board-sum { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 14px; }
.finder { display: flex; flex-wrap: wrap; gap: 8px 10px; align-items: flex-end; }
.finder label { display: grid; gap: 3px; font-size: 12px; color: var(--ink-2); }
.free { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
.free span { font-size: 12.5px; padding: 4px 10px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface-2); }
.free span.ok { border-color: color-mix(in srgb, var(--pos) 45%, var(--line)); }
.free span.ok::before { content: "✓ "; color: var(--pos); font-weight: 700; }
.foot { margin-top: 28px; font-size: 12.5px; color: var(--muted); display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.linkbtn { background: none; border: 0; padding: 0; color: var(--accent); font-weight: 600; cursor: pointer; text-decoration: underline; text-underline-offset: 2px; }

/* modal */
.modal { position: fixed; inset: 0; z-index: 50; background: var(--scrim); display: flex; align-items: flex-start; justify-content: center; padding: max(4vh, 16px) 16px; overflow-y: auto; }
.sheet { background: var(--surface); border-radius: 14px; width: min(660px, 100%); box-shadow: var(--shadow); padding: 20px 20px 18px; border: 1px solid var(--line); }
.sheet h3 { font-family: var(--f-display); font-size: 21px; font-weight: 600; margin: 0 0 14px; letter-spacing: -.01em; }
.form { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px 14px; }
.form .full { grid-column: 1 / -1; }
@media (max-width: 540px) { .form { grid-template-columns: minmax(0, 1fr); } }
.f { display: flex; flex-direction: column; gap: 4px; font-size: 12.5px; color: var(--ink-2); font-weight: 500; min-width: 0; }
.f small { color: var(--muted); font-size: 11.5px; min-height: 1em; }
.in { border: 1px solid var(--line); background: var(--surface-2); border-radius: 8px; padding: 8px 10px; font-size: 14px; color: var(--ink); width: 100%; min-width: 0; }
.in:focus { border-color: var(--accent); outline: none; box-shadow: 0 0 0 3px var(--accent-soft); }
textarea.in { resize: vertical; }
.money { text-align: right; font-variant-numeric: tabular-nums; }
.seg { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; }
.seg.two { grid-template-columns: repeat(2, minmax(0, 1fr)); }
@media (max-width: 540px) { .seg { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.seg label { border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; display: flex; gap: 8px; align-items: center; cursor: pointer; font-size: 13px; font-weight: 600; color: var(--ink); background: var(--surface); }
.seg input { position: absolute; opacity: 0; pointer-events: none; }
.seg label:has(input:checked) { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); background: var(--surface-2); }
.seg label:has(input:focus-visible) { outline: 2px solid var(--accent); outline-offset: 2px; }
.finbox { grid-column: 1 / -1; border: 1px dashed var(--axis); border-radius: 10px; padding: 12px; display: grid; gap: 12px 14px; grid-template-columns: repeat(2, minmax(0, 1fr)); }
@media (max-width: 540px) { .finbox { grid-template-columns: minmax(0, 1fr); } }
.finbox h4 { grid-column: 1 / -1; margin: 0; font-size: 13px; display: flex; gap: 6px; align-items: center; color: var(--accent); }
.calc { grid-column: 1 / -1; display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 8px; background: var(--surface-2); border-radius: 8px; padding: 10px 12px; }
.calc div { display: grid; font-size: 12px; color: var(--ink-2); }
.calc b { font-size: 15px; color: var(--ink); font-variant-numeric: tabular-nums; }
.actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 16px; flex-wrap: wrap; }
.actions .left { margin-right: auto; }
.err { color: var(--neg); font-size: 13px; margin: 10px 0 0; }
.meta { color: var(--muted); font-size: 12px; margin: 10px 0 0; }
.chrow { display: grid; grid-template-columns: minmax(0, 1fr) 96px auto; gap: 8px; align-items: center; }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(20px + env(safe-area-inset-bottom, 0px)); background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 10px; font-size: 13.5px; font-weight: 500; z-index: 80; box-shadow: var(--shadow); max-width: calc(100vw - 32px); }
.toast.err { background: var(--neg); color: #fff; }

@media (max-width: 640px) {

const allBk = () => S.bks;

const role = () => S.role;

/* ---------- finance engine ---------- */
function activeDays(a, M) {

function perMonths(p) {

}
function perLabel(p) {

}
const PREV_WORD = { month: 'tháng trước', quarter: 'quý trước', year: 'năm trước' };

/* ---------- rendering ---------- */
let rafId = 0;
function schedule() { if (!rafId) rafId = requestAnimationFrame(render); }

function render() {
  rafId = 0;
  const app = $('#app');
  const tw = app.querySelector('.tl-wrap');
  const keep = tw ? tw.scrollLeft : null;
  let html;
  if (S.mode === 'loading') html = topbar() + '<div class="empty">Đang tải dữ liệu…</div>';
  else if (S.mode === 'err') html = topbar() + `<div class="card empty"><h3>Chưa tải được dữ liệu</h3><p>${esc(S.errText)}</p><button class="btn primary" data-act="retry">Thử lại</button></div>`;
  else {
    const r = role();
    const tabs = TABS[r];
    if (!tabs.some(t => t[0] === S.tab)) S.tab = tabs[0][0];
    html = topbar(r) + (tabs.length > 1 ? tabbar(tabs) : '') + view(r);
  }
  app.innerHTML = html;
  const nw = app.querySelector('.tl-wrap');
  if (nw) {
    if (S.scrollToday) {
      const td = nw.querySelector('.tl-day.td');
      const nameW = (nw.querySelector('.tl-corner') || {}).offsetWidth || 0;
      nw.scrollLeft = td ? Math.max(0, td.offsetLeft - nameW - td.offsetWidth * 2) : 0;
      S.scrollToday = false;
    } else if (keep != null) nw.scrollLeft = keep;
  }
  const tr = $('#trend');
  if (tr) drawTrend(tr);
}

function topbar(r) {
  let right = '';
  if (r) {
    right += `<button class="btn ghost icon" data-act="refresh" title="Tải lại dữ liệu" aria-label="Tải lại dữ liệu">${I.sync}</button>`;
    if (r === 'admin') {
      if (S.sheetUrl) right += `<a class="btn ghost" href="${esc(S.sheetUrl)}" target="_blank" rel="noopener">${I.ext}Google Sheet</a>`;
      right += `<button class="btn ghost" data-act="settings">${I.gear}Cài đặt</button>`;
    }
    right += TOKEN
      ? `<button class="btn ghost" data-act="pw" title="Đổi mật khẩu">${I.user}${esc(S.me || S.uid || '')}</button><button class="btn" data-act="logout">Đăng xuất</button>`
      : `<button class="btn primary" data-act="login">Đăng nhập</button>`;
  }
  return `<header class="top"><div class="brand"><span class="mark">${I.key}</span>Wabisabi Homestay</div>
    ${r ? `<span class="role">${ROLE_LABEL[r]}</span>` : ''}<span class="spacer"></span><div class="topbtns">${right}</div></header>`;
}
function tabbar(tabs) {
  return `<nav class="tabs" role="tablist">${tabs.map(([k, l]) => `<button class="tab" role="tab" aria-selected="${S.tab === k}" data-act="tab" data-v="${k}">${l}</button>`).join('')}</nav>`;
}
function view(r) {
  switch (S.tab) {
    case 'cal': return viewCal(r);
    case 'board': return viewBoard(r);
    case 'fin': return viewFin();
    case 'exp': return viewExp();
    case 'apts': return viewApts();
  }
  return '';
}
function monthNav(prefix, M, label) {
  return `<div class="nav"><button class="btn icon" data-act="${prefix}-prev" aria-label="Trước">${I.l}</button><h2>${label || mLabel(M)}</h2><button class="btn icon" data-act="${prefix}-next" aria-label="Sau">${I.r}</button></div>`;
}
const NIGHT_HINT = 'Mỗi ô là 1 đêm, số trên thanh màu là số đêm. Ví dụ nhận phòng ngày 8, trả ngày 11 thì tô 3 ô 8, 9, 10; ô 11 còn trống cho khách mới. Ô xám: căn chưa thuê / chưa nhận vận hành hoặc đã hết hợp đồng, không nhận khách.';
const legend = () => `<div class="legend">${ST_ORDER.map(k => `<span><i class="sw st-${k}"></i>${ST[k].label}</span>`).join('')}<span><i class="sw" style="background:var(--off)"></i>Chưa thuê / chưa vận hành</span></div>`;
/** Ngoài thời gian căn đã thuê / đã nhận vận hành (trước ngày bắt đầu, sau ngày kết thúc). */
const isOff = (a, d) => !!a && ((DRE.test(a.start || '') && d < a.start) || (DRE.test(a.end || '') && d > a.end));
const offWhy = (a, d) => (DRE.test(a.start || '') && d < a.start ? `Chưa thuê / chưa nhận vận hành (bắt đầu ${dLabel(a.start)}/${a.start.slice(0, 4)})` : `Đã hết hợp đồng (kết thúc ${dLabel(a.end)}/${a.end.slice(0, 4)})`);

/* timeline: rows [{id,name,sub,bks:[{ci,co,st,guest,_id}]}] */
function timeline(rows, opt) {
  const M = S.month, n = dim(M), first = mFirst(M), end = mFirst(mNext(M)), td = todayStr();
  const days = Array.from({ length: n }, (_, i) => addDays(first, i));
  let h = `<div class="tl-wrap"><div class="tl" style="--n:${n}"><div class="tl-head"><div class="tl-corner">Căn hộ</div>`;
  for (const d of days) { const w = wd(d); h += `<div class="tl-day${w === 0 || w === 6 ? ' we' : ''}${d === td ? ' td' : ''}">${WD[w]}<b>${+d.slice(8)}</b></div>`; }
  h += '</div>';
  for (const r of rows) {
    h += `<div class="tl-row"><div class="tl-name"><b title="${esc(r.name)}">${esc(r.name)}</b>${r.sub ? `<small>${r.sub}</small>` : ''}</div>`;
    days.forEach((d, i) => {
      const w = wd(d), cls = `tl-cell${w === 0 || w === 6 ? ' we' : ''}${d === td ? ' td' : ''}`;
      if (isOff(r, d)) { h += `<div class="${cls} off" style="grid-column:${i + 2}" title="${esc(offWhy(r, d))}"></div>`; return; }
      h += opt.editable
        ? `<button class="${cls}" style="grid-column:${i + 2}" data-act="new" data-apt="${esc(r.id)}" data-d="${d}" aria-label="Thêm booking ${esc(r.name)} ngày ${dLabel(d)}"></button>`
        : `<div class="${cls}" style="grid-column:${i + 2}"></div>`;
    });
    for (const b of r.bks) {
      if (!(b.ci < end && b.co > first)) continue;
      // Mỗi ô là 1 đêm: thanh màu phủ đúng các đêm từ ngày nhận đến trước ngày trả.
      const lastNight = addDays(b.co, -1);
      const cutL = b.ci < first, cutR = lastNight >= end;
      const s = cutL ? 0 : diff(first, b.ci), e = cutR ? n - 1 : diff(first, lastNight);
      const nights = diff(b.ci, b.co);
      const label = opt.names ? (b.guest || ST[b.st].label) : ST[b.st].label;
      const title = `${ST[b.st].long} · ${nights} đêm: đêm ${dLabel(b.ci)} → đêm ${dLabel(lastNight)}, trả phòng ${dLabel(b.co)}${opt.names && b.guest ? ' · ' + b.guest : ''}${b.lock ? ' · Bạn chỉ xem được' : ''}`;
      const cls = `tl-bar st-${b.st}${cutL ? ' cl' : ''}${cutR ? ' cr' : ''}${b.lock ? ' lk' : ''}`;
      const st = `grid-column:${s + 2}/${e + 3}`;
      const inner = `<span class="nn" aria-label="${nights} đêm">${nights}</span>${b.lock ? `<span class="lki" aria-label="Chỉ xem">${I.lock}</span>` : ''}<span class="lb">${esc(label)}</span>`;
      h += opt.editable
        ? `<button class="${cls}" style="${st}" data-act="edit" data-id="${esc(b._id)}" title="${esc(title)}">${inner}</button>`
        : `<div class="${cls}" style="${st}" title="${esc(title)}">${inner}</div>`;
    }
    h += '</div>';
  }
  return h + '</div></div>';
}

const hostName = h => (h ? esc((S.hosts[h] && S.hosts[h].label) || h) : 'chưa gán');
const aptSub = a => (a.kind === 'managed' ? `Chủ nhà · ${hostName(a.hostId)}` : 'Thuê lại để vận hành');

/* ---- Calendar tab ---- */
function viewCal(r) {
  const admin = r === 'admin';
  let apts = listApts();
  if (admin) apts = apts.filter(a => a.active !== false);
  if (admin && S.filter !== 'all') apts = apts.filter(a => a.kind === S.filter);
  const bks = allBk();
  const rows = apts.map(a => ({ id: a._id, name: a.name, start: a.start, end: a.end, sub: admin ? aptSub(a) : esc(a.address || ''), bks: bks.filter(b => b.aptId === a._id) }));
  const chips = admin ? `<div class="chips">${[['all', 'Tất cả'], ['leased', 'Căn thuê lại'], ['managed', 'Căn chủ nhà']].map(([k, l]) => `<button class="chip" aria-pressed="${S.filter === k}" data-act="filter" data-v="${k}">${l}</button>`).join('')}</div>` : '';
  let out = `<div class="toolbar">${monthNav('m', S.month)}<button class="btn" data-act="m-today">Hôm nay</button>${chips}<span class="spacer"></span>${apts.length ? `<button class="btn primary" data-act="new">${I.plus}Booking</button>` : ''}</div>`;
  if (!apts.length) {
    if (admin) return out + `<div class="card empty"><h3>Chưa có căn hộ nào</h3><p>Thêm căn bạn thuê lại hoặc căn vận hành cho chủ nhà, rồi bấm vào ngày để tạo booking. Muốn xem thử trước: mở Google Sheet → menu Wabisabi Homestay → Tạo dữ liệu mẫu.</p><button class="btn primary" data-act="apt-new">${I.plus}Thêm căn hộ</button></div>`;
    return out + `<div class="card empty"><h3>Chưa có căn nào được gán cho bạn</h3><p>Người quản lý sẽ gán căn hộ của bạn vào tài khoản này.</p></div>`;
  }
  out += `<div class="toolbar">${legend()}</div>`;
  if (admin) {
    const A = summarize([S.month], bks).tot;
    out += `<div class="strip"><span>Công suất <b>${pct(A.occ)}</b></span><span>Đêm đã bán <b>${A.sold}</b></span><span>Đêm đang giữ <b>${A.held}</b></span><span>Doanh thu phòng <b>${money(A.gross)} ₫</b></span></div>`;
  }
  out += timeline(rows, { editable: true, names: true });
  out += `<p class="hint">${NIGHT_HINT} Bấm vào ô trống để thêm booking, bấm vào thanh màu để sửa.${admin ? '' : ' Bạn chỉ thêm được booking Khách chủ nhà. Booking có biểu tượng ổ khóa do quản lý phụ trách: bạn chỉ xem ngày và trạng thái, tên khách được ẩn.'}</p>`;
  out += upcoming(rows);
  return out;
}
function upcoming(rows) {
  const t = todayStr(), t7 = addDays(t, 7), ins = [], outs = [];
  for (const r of rows) for (const b of r.bks) {
    if (b.ci >= t && b.ci < t7) ins.push({ d: b.ci, name: r.name, b });
    if (b.co >= t && b.co < t7) outs.push({ d: b.co, name: r.name, b });
  }
  const li = x => `<li><span class="d">${dayName(x.d)}</span><i class="dot st-${x.b.st}"></i><span class="who">${esc(x.name)} <small>· ${esc(x.b.guest || ST[x.b.st].label)}</small></span><small>${diff(x.b.ci, x.b.co)} đêm</small></li>`;
  const list = a => (a.length ? `<ul>${a.sort((p, q) => (p.d < q.d ? -1 : 1)).map(li).join('')}</ul>` : '<p class="nil">Không có trong 7 ngày tới.</p>');
  return `<div class="up"><div class="card"><h3>Nhận phòng <small>7 ngày tới</small></h3>${list(ins)}</div><div class="card"><h3>Trả phòng <small>7 ngày tới · lên lịch dọn</small></h3>${list(outs)}</div></div>`;
}

/* ---- Public board ---- */
function boardRows() {
  const apts = (S.board && S.board.apts) || [];
  return apts.map(d => {
    const ranges = Array.isArray(d.ranges) ? d.ranges.filter(x => Array.isArray(x) && DRE.test(x[0]) && DRE.test(x[1]) && x[1] > x[0]) : [];
    return { key: String(d.id), name: String(d.name || 'Căn hộ'), order: +d.order || 0, start: d.start || '', end: d.end || '', ranges: ranges.map(x => ({ ci: x[0], co: x[1], st: ST[x[2]] ? x[2] : 'hold', _id: '' })) };
  }).sort(byOrder);
}
function viewBoard(r) {
  const rows = boardRows(), t = todayStr();
  const busy = rr => rr.ranges.find(x => x.ci <= t && t < x.co);
  const open = rows.filter(x => !isOff(x, t));
  const free = open.filter(x => !busy(x)).length;
  let out = `<div class="toolbar">${monthNav('m', S.month)}<button class="btn" data-act="m-today">Hôm nay</button><span class="spacer"></span>${legend()}</div>`;
  if (r === 'admin') out += `<div class="note" style="margin-bottom:14px">Ai có link app đều xem được trang này mà <b>không cần đăng nhập</b>: chỉ có tên căn và màu trạng thái, không có tên khách, giá hay ghi chú, và không sửa được.</div>`;
  if (!rows.length) return out + `<div class="card empty"><h3>Chưa có căn hộ nào trên bảng</h3><p>Lịch các căn sẽ hiện ở đây khi người quản lý thêm căn và booking.</p></div>`;
  out += `<div class="board-sum"><div class="kpi"><div class="l">Tối nay (${dLabel(t)})</div><div class="v">${free}<small> / ${open.length} căn trống</small></div></div>`;
  const f = S.find, ok = DRE.test(f.ci) && DRE.test(f.co) && f.co > f.ci;
  out += `<div class="kpi" style="flex:1;min-width:260px"><div class="l">Tìm căn trống</div><div class="finder"><label>Nhận phòng<input class="in" type="date" id="f-ci" value="${f.ci}"></label><label>Trả phòng<input class="in" type="date" id="f-co" value="${f.co}"></label></div>`;
  if (ok) {
    const outside = x => isOff(x, f.ci) || isOff(x, addDays(f.co, -1));
    const res = rows.map(x => ({ x, off: outside(x), ok: !outside(x) && !x.ranges.some(b => b.ci < f.co && b.co > f.ci) }));
    const nOk = res.filter(z => z.ok).length;
    out += `<div class="free">${res.map(z => `<span class="${z.ok ? 'ok' : ''}">${esc(z.x.name)}${z.ok ? '' : z.off ? ' · chưa nhận khách' : ' · đã có lịch'}</span>`).join('')}</div><div class="d" style="margin-top:6px">${nOk} căn trống ${diff(f.ci, f.co)} đêm từ ${dLabel(f.ci)}</div>`;
  } else if (f.ci || f.co) out += `<div class="d" style="margin-top:6px">Chọn ngày trả phòng sau ngày nhận phòng.</div>`;
  out += `</div></div>`;
  out += timeline(rows.map(x => ({ id: x.key, name: x.name, start: x.start, end: x.end, sub: isOff(x, t) ? 'Tối nay: chưa nhận khách' : busy(x) ? `Tối nay: ${ST[busy(x).st].label.toLowerCase()}` : 'Tối nay: trống', bks: x.ranges })), { editable: false, names: false });
  out += `<p class="hint">${NIGHT_HINT} ${S.loadedAt ? 'Cập nhật lúc ' + fmtTime(S.loadedAt.toISOString()) + '. ' : ''}Trang tự làm mới mỗi phút.</p>`;
  return out;
}

/* trend chart (SVG, one axis, VND) */
function niceTicks(min, max, count) {
  if (max === min) max = min + 1;
  const span = max - min, step0 = span / count, mag = Math.pow(10, Math.floor(Math.log10(step0)));
  const err = step0 / mag, step = (err >= 7.5 ? 10 : err >= 3.5 ? 5 : err >= 1.5 ? 2 : 1) * mag;
  const lo = Math.floor(min / step) * step, hi = Math.ceil(max / step) * step, out = [];
  for (let v = lo; v <= hi + step / 2; v += step) out.push(Math.round(v));
  return out;
}
function colPath(x, y0, y1, w) {
  const top = Math.min(y0, y1), bot = Math.max(y0, y1), h = bot - top;
  if (h < 0.5) return '';
  const r = Math.min(4, h, w / 2);
  if (y1 <= y0) return `M${x},${bot}V${top + r}Q${x},${top} ${x + r},${top}H${x + w - r}Q${x + w},${top} ${x + w},${top + r}V${bot}Z`;
  return `M${x},${top}V${bot - r}Q${x},${bot} ${x + r},${bot}H${x + w - r}Q${x + w},${bot} ${x + w},${bot - r}V${top}Z`;
}
function drawTrend(el) {
  const end = el.dataset.end, months = [];
  let M = end;
  for (let i = 0; i < 12; i++) { months.unshift(M); M = mPrev(M); }
  const bks = allBk(), curM = ym(todayStr());
  const data = months.map(m => { const t = summarize([m], bks).tot; return { M: m, net: t.net, cost: t.cost, profit: t.net - t.cost, fut: m > curM }; });
  const W = Math.max(300, el.clientWidth), H = 260, pl = 52, pr = 8, pt = 12, pb = 30;
  const vals = data.flatMap(d => [d.net, d.cost, d.profit]);
  const ticks = niceTicks(Math.min(0, ...vals), Math.max(0, ...vals), 4);
  const lo = ticks[0], hi = ticks[ticks.length - 1];
  const y = v => pt + (hi - v) / (hi - lo || 1) * (H - pt - pb);
  const bw = (W - pl - pr) / data.length, barW = Math.max(3, Math.min(14, (bw - 10) / 2));
  let s = `<svg width="${W}" height="${H}" role="img" aria-label="Doanh thu thuần, tổng chi phí và lãi lỗ 12 tháng">`;
  for (const tv of ticks) s += `<line x1="${pl}" x2="${W - pr}" y1="${y(tv)}" y2="${y(tv)}" stroke="var(${tv === 0 ? '--axis' : '--grid'})" stroke-width="1"/><text x="${pl - 6}" y="${y(tv) + 3.5}" text-anchor="end">${tv === 0 ? '0' : compact(tv)}</text>`;
  const every = bw < 30 ? 2 : 1;
  data.forEach((d, i) => {
    const cx = pl + i * bw + bw / 2, op = d.fut ? ' opacity="0.45"' : '';
    s += `<path d="${colPath(cx - barW - 1, y(0), y(d.net), barW)}" fill="var(--s1)"${op}/>`;
    s += `<path d="${colPath(cx + 1, y(0), y(d.cost), barW)}" fill="var(--s2)"${op}/>`;
    if (i % every === 0 || i === data.length - 1) {
      const [yy, mm] = d.M.split('-');
      s += `<text x="${cx}" y="${H - 12}" text-anchor="middle">T${+mm}</text>${+mm === 1 || i === 0 ? `<text x="${cx}" y="${H - 1}" text-anchor="middle">${yy}</text>` : ''}`;
    }
  });
  const pts = data.map((d, i) => [pl + i * bw + bw / 2, y(d.profit)]);
  s += `<polyline points="${pts.map(p => p.join(',')).join(' ')}" fill="none" stroke="var(--s3)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>`;
  pts.forEach((p, i) => { s += `<circle cx="${p[0]}" cy="${p[1]}" r="${i === pts.length - 1 ? 5 : 3.5}" fill="var(--s3)" stroke="var(--surface)" stroke-width="2"/>`; });
  data.forEach((d, i) => { s += `<rect x="${pl + i * bw}" y="${pt}" width="${bw}" height="${H - pt - pb}" fill="transparent" data-i="${i}"/>`; });
  s += '</svg><div class="tip" hidden></div>';
  el.innerHTML = s;
  const tip = el.querySelector('.tip'), svg = el.querySelector('svg');
  const show = i => {
    const d = data[i];
    tip.innerHTML = `<b>${mLabel(d.M)}${d.fut ? ' · dự kiến' : ''}</b><div><span><i style="background:var(--s1)"></i>Doanh thu thuần</span><span>${money(d.net)}</span></div><div><span><i style="background:var(--s2)"></i>Tổng chi phí</span><span>${money(d.cost)}</span></div><div><span><i style="background:var(--s3)"></i>Lãi/lỗ ròng</span><b class="${d.profit < 0 ? 'neg' : ''}" style="margin:0">${acc(d.profit)}</b></div>`;
    tip.hidden = false;
    const cx = pl + i * bw + bw / 2, tw = tip.offsetWidth;
    tip.style.left = Math.min(W - tw - 4, Math.max(4, cx + 12 > W - tw ? cx - tw - 12 : cx + 12)) + 'px';
    tip.style.top = '8px';
  };
  svg.addEventListener('mousemove', e => { const i = e.target.dataset && e.target.dataset.i; if (i != null) show(+i); });
  svg.addEventListener('mouseleave', () => { tip.hidden = true; });
  svg.addEventListener('click', e => { const i = e.target.dataset && e.target.dataset.i; if (i != null) show(+i); });
}

/* ---------- modal plumbing ---------- */
function openModal(html, state) {
  MS = state;
  $('#sheet').innerHTML = html;
  $('#modal').hidden = false;
  document.body.classList.add('noscroll');
  if (MS && MS.recalc) MS.recalc({});
  const first = $('#sheet').querySelector('input:not([type=radio]):not([type=checkbox]):not([disabled]), select, textarea');
  if (first && matchMedia('(pointer:fine)').matches) first.focus();
}
function closeModal() { $('#modal').hidden = true; $('#sheet').innerHTML = ''; document.body.classList.remove('noscroll'); MS = null; }
function showErr(m) { const e = $('#m-err'); if (e) { e.textContent = m; e.hidden = false; } }
function busy(on) {
  const b = $('#sheet [data-m="save"]');
  if (!b) return;
  if (!b.dataset.label) b.dataset.label = b.textContent;
  b.disabled = on; b.textContent = on ? 'Đang lưu…' : b.dataset.label;
}
function armed(btn, text) {
  if (btn.dataset.armed) return true;
  if (!btn.dataset.label) btn.dataset.label = btn.textContent;
  btn.dataset.armed = '1'; btn.textContent = text || 'Bấm lần nữa để xác nhận';
  setTimeout(() => { if (btn.isConnected) { delete btn.dataset.armed; btn.textContent = btn.dataset.label; } }, 4000);
  return false;
}
const val = id => { const e = document.getElementById(id); return e ? e.value : ''; };
const radio = name => { const e = document.querySelector(`input[name="${name}"]:checked`); return e ? e.value : ''; };
let tt = 0;
function toast(msg, kind) { const t = $('#toast'); t.textContent = msg; t.className = 'toast' + (kind === 'err' ? ' err' : ''); t.hidden = false; clearTimeout(tt); tt = setTimeout(() => { t.hidden = true; }, 3600); }

function bkRecalc(ev) {
  const id = ev.target && ev.target.id;
  const apt = S.apts[val('b-apt')] || {};
  const ci = val('b-ci');
  if (id === 'b-ci' && DRE.test(ci) && !(val('b-co') > ci)) $('#b-co').value = addDays(ci, 1);
  const co = val('b-co');
  const n = DRE.test(ci) && DRE.test(co) ? diff(ci, co) : 0;
  $('#b-nights').textContent = n > 0 ? `${n} đêm (đêm ${dLabel(ci)} → đêm ${dLabel(addDays(co, -1))}, trả phòng ${dLabel(co)})` : 'ngày trả phải sau ngày nhận';
  if (!MS.admin) return;
  let st = radio('b-st');
  $('#b-fin').hidden = st === 'owner';
  if (id === 'b-total') MS.totalTouched = !!val('b-total');
  if (id === 'b-ch') { const c = S.cfg.channels.find(c => c.name === val('b-ch')); if (c) $('#b-fee').value = c.fee; }
  if (!MS.totalTouched && apt.snight && n > 0 && (id === 'b-apt' || id === 'b-ci' || id === 'b-co' || id === undefined)) $('#b-total').value = money(apt.snight * n);
  const total = pm(val('b-total')), paid = pm(val('b-paid')), fee = +val('b-fee') || 0;
  if (id === 'b-paid' && st !== 'owner') {
    const want = total > 0 && paid >= total ? 'paid' : paid > 0 ? 'deposit' : null;
    if (want) { const r = document.querySelector(`input[name="b-st"][value="${want}"]`); if (r) { r.checked = true; st = want; } }
  }
  const managed = apt.kind === 'managed';
  $('#b-oc-wrap').hidden = !managed;
  const ocAuto = n * (+apt.onight || 0), ocRaw = val('b-oc').trim();
  const oc = managed ? (ocRaw ? pm(ocRaw) : ocAuto) : 0;
  $('#b-och').textContent = managed ? (ocRaw ? 'Đã nhập tay · xóa trống để tự tính' : `Tự tính: ${n} đêm × ${money(apt.onight)} = ${money(ocAuto)}`) : '';
  $('#b-pn').textContent = n > 0 && total ? `≈ ${money(total / n)} ₫/đêm${apt.snight ? ' · gợi ý ' + money(apt.snight) : ''}` : (apt.snight ? `Giá gợi ý ${money(apt.snight)} ₫/đêm` : '');
  const feeAmt = total * fee / 100;
  const cell = (l, v, cls) => `<div>${l}<b class="${cls || ''}">${acc(v)}</b></div>`;
  $('#b-calc').innerHTML = cell('Còn phải thu', total - paid, total - paid > 0 ? '' : 'pos') + cell('Phí kênh', feeAmt)
    + (managed ? cell('Trả chủ nhà', oc) + cell('Lãi booking', total - feeAmt - oc, total - feeAmt - oc < 0 ? 'neg' : 'pos')
      : cell('Thu thuần (sau phí kênh)', total - feeAmt));
}
function bkSave() {
  const old = MS.b;
  const aptId = val('b-apt'), ci = val('b-ci'), co = val('b-co'), st = radio('b-st');
  if (!DRE.test(ci) || !DRE.test(co) || co <= ci) return showErr('Ngày trả phòng phải sau ngày nhận phòng.');
  if (!ST[st]) return showErr('Chọn trạng thái booking.');
  const ap = S.apts[aptId];
  if (!old._id || old.ci !== ci || old.co !== co || old.aptId !== aptId) {
    if (ap && DRE.test(ap.start || '') && ci < ap.start) return showErr(`Căn này chỉ nhận khách từ đêm ${dLabel(ap.start)}/${ap.start.slice(0, 4)}. Trước ngày đó căn chưa thuê / chưa nhận vận hành.`);
    if (ap && DRE.test(ap.end || '') && addDays(co, -1) > ap.end) return showErr(`Căn này chỉ nhận khách đến hết đêm ${dLabel(ap.end)}/${ap.end.slice(0, 4)} (ngày kết thúc hợp đồng).`);
  }
  const clash = allBk().find(x => x.aptId === aptId && x._id !== old._id && x.ci < co && x.co > ci);
  if (clash) return showErr(`Trùng lịch với booking ${dLabel(clash.ci)} → ${dLabel(clash.co)}${clash.guest ? ' (' + clash.guest + ')' : ''}.`);
  const b = { id: old._id || '', aptId, ci, co, st, guest: val('b-guest').trim(), pax: +val('b-pax') || 0, note: val('b-note').trim() };
  let f = null;
  if (MS.admin && st !== 'owner') {
    const apt = S.apts[aptId] || {}, ocRaw = val('b-oc').trim();
    f = { channel: val('b-ch'), feePct: +val('b-fee') || 0, total: pm(val('b-total')), paid: pm(val('b-paid')), ocost: apt.kind === 'managed' && ocRaw ? pm(ocRaw) : null, phone: val('b-phone').trim() };
  }
  return submit(() => api('saveBooking', TOKEN, b, f), 'Đã lưu booking');
}

  for (const r of A.rows) per.push([r.name, r.kind === 'managed' ? 'Chủ nhà' : 'Thuê lại', r.sold, r.availNet, rat(r.occ), num(r.adr), num(r.gross), num(r.fee), num(r.net), num(r.cogs), num(r.gp), num(r.opex), num(r.profit), rat(r.margin)]);
  if (A.common) per.push(['Chi phí chung', '', '', '', '', '', '', '', '', '', '', num(A.common), num(-A.common), '']);
  per.push(['TỔNG', '', t.sold, t.availNet, rat(t.occ), num(t.adr), num(t.gross), num(t.fee), num(t.net), num(t.cogs), num(t.gp), num(t.opex + A.common), num(t.pre), rat(t.net ? t.pre / t.net : NaN)]);
  const s = mFirst(months[0]), e = mFirst(mNext(months[months.length - 1]));
  const bk = [['Căn hộ', 'Nhận phòng', 'Trả phòng', 'Đêm', 'Đêm trong kỳ', 'Trạng thái', 'Khách', 'Kênh', 'Giá bán ra', 'Đã thu', 'Còn phải thu']];
  for (const b of bks.filter(b => b.ci < e && b.co > s).sort((x, y) => (x.ci < y.ci ? -1 : 1))) {
    const a = S.apts[b.aptId] || {}, f = finOf(b._id);
    bk.push([a.name || '', b.ci, b.co, diff(b.ci, b.co), overlapN(b.ci, b.co, s, e), ST[b.st].label, b.guest || '', f.channel || '', +f.total || '', +f.paid || '', f.total ? Math.max(0, f.total - (f.paid || 0)) : '']);
  }
  const title = `Báo cáo ${perLabel(p).replace('Tháng ', 'T')}`;
  btn.disabled = true; toast('Đang ghi báo cáo vào Google Sheet…');
  try {
    const r = await api('exportReport', TOKEN, title, [
      { title: `Kết quả kinh doanh – ${perLabel(p)}`, rows: stmt, pct: [2] },
      { title: 'Chỉ số vận hành', rows: kpi },
      { title: 'Lãi lỗ theo căn', rows: per, pct: [4, 13] },
      { title: 'Booking trong kỳ', rows: bk },
    ]);
    openModal(`<h3>Đã xuất báo cáo</h3><p style="margin:0 0 12px;color:var(--ink-2)">Báo cáo nằm ở trang <b>${esc(r.name)}</b> trong Google Sheet của bạn. Muốn có file Excel: mở trang đó → <b>Tệp → Tải xuống → Microsoft Excel (.xlsx)</b>.</p><div class="actions"><button class="btn" data-m="close">Đóng</button><a class="btn primary" href="${esc(r.url)}" target="_blank" rel="noopener">${I.ext}Mở báo cáo</a></div>`, { type: 'info' });
  } catch (err) { toast(errMsg(err), 'err'); }
  finally { if (btn.isConnected) btn.disabled = false; }
}
async function clearSample(btn) {
  if (!armed(btn, 'Bấm lần nữa để xóa hết dữ liệu mẫu')) return;
  btn.disabled = true;
  try { await api('clearSample', TOKEN); await loadAll(true); toast('Đã xóa dữ liệu mẫu'); }
  catch (e) { toast(errMsg(e), 'err'); btn.disabled = false; }
}

/* ---------- events ---------- */
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if (!el || !$('#app').contains(el)) return;
  const a = el.dataset.act, v = el.dataset.v;
  switch (a) {
    case 'tab': S.tab = v; if (v === 'cal' || v === 'board') S.scrollToday = S.month === ym(todayStr()); window.scrollTo(0, 0); break;
    case 'm-prev': S.month = mPrev(S.month); S.scrollToday = false; resetScroll(); break;
    case 'm-next': S.month = mNext(S.month); S.scrollToday = false; resetScroll(); break;
    case 'm-today': S.month = ym(todayStr()); S.scrollToday = true; break;
    case 'filter': S.filter = v; break;
    case 'new': if (S.role !== 'viewer') openBooking({ aptId: el.dataset.apt, d: el.dataset.d }); return;
    case 'edit': if (S.role !== 'viewer') openBooking({ id: el.dataset.id }); return;
    case 'p-prev': S.per = perShift(S.per, -1); break;
    case 'p-next': S.per = perShift(S.per, 1); break;
    case 'p-type': { const ms = perMonths(S.per), cur = ym(todayStr()); S.per = perFrom(v, ms.includes(cur) ? cur : ms[0]); break; }
    case 'e-prev': S.expMonth = mPrev(S.expMonth); break;
    case 'e-next': S.expMonth = mNext(S.expMonth); break;
    case 'export': exportFin(el); return;
    case 'exp-new': openExp(); return;
    case 'exp-edit': openExp(el.dataset.id); return;
    case 'apt-new': openApt(); return;
    case 'apt-edit': openApt(el.dataset.id); return;
    case 'host-new': openHost(); return;
    case 'host-edit': openHost(el.dataset.id); return;
    case 'settings': openSettings(); return;
    case 'login': openLogin(); return;
    case 'logout': doLogout(); return;
    case 'pw': openPw(); return;
    case 'clear-sample': clearSample(el); return;
    case 'refresh': loadAll().then(() => toast('Đã tải lại')); return;
    case 'retry': S.mode = 'loading'; schedule(); loadAll(); return;
  }
  schedule();
});
function resetScroll() { const w = $('#app .tl-wrap'); if (w) w.scrollLeft = 0; }
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && !$('#modal').hidden) { closeModal(); return; }
  if (e.key === 'Enter' && MS && MS.type === 'login' && e.target.tagName === 'INPUT') { e.preventDefault(); MS.save(); return; }
  if ((e.key === 'Enter' || e.key === ' ') && e.target.matches && e.target.matches('tr[data-act]')) { e.preventDefault(); e.target.click(); }
});
document.addEventListener('change', e => {
  if (e.target.id === 'f-ci' || e.target.id === 'f-co') {
    S.find[e.target.id === 'f-ci' ? 'ci' : 'co'] = e.target.value;
    if (e.target.id === 'f-ci' && DRE.test(e.target.value) && !(S.find.co > e.target.value)) S.find.co = addDays(e.target.value, 1);
    schedule();
  }
});
$('#modal').addEventListener('click', e => {
  if (e.target === $('#modal')) { closeModal(); return; }
  const b = e.target.closest('[data-m]');
  if (!b || !MS) return;
  const m = b.dataset.m;
  if (m === 'close') closeModal();
  else if (m === 'save' && MS.save) MS.save();
  else if (m === 'del' && MS.del) MS.del(b);
  else if (m === 'addch') $('#chs').insertAdjacentHTML('beforeend', chRow({ name: '', fee: 0 }));
  else if (m === 'rmch') b.closest('.chrow').remove();
});
const onModalInput = e => {
  if (!MS) return;
  if (e.target.classList && e.target.classList.contains('money') && e.type === 'input') {
    const d = e.target.value.replace(/\D/g, '').slice(0, 13);
    e.target.value = d ? NF.format(+d) : '';
  }
  if (MS.recalc) MS.recalc(e);
};
$('#modal').addEventListener('input', onModalInput);
$('#modal').addEventListener('change', e => { if (e.target.type === 'radio' || e.target.tagName === 'SELECT') onModalInput(e); });
let rz = 0;
addEventListener('resize', () => { clearTimeout(rz); rz = setTimeout(() => { const tr = $('#trend'); if (tr) drawTrend(tr); }, 150); });
setInterval(() => { if (!document.hidden && !MS && S.mode === 'ok') loadAll(true); }, 60000);
document.addEventListener('visibilitychange', () => { if (!document.hidden && !MS && S.mode === 'ok' && S.loadedAt && Date.now() - S.loadedAt > 30000) loadAll(true); });

/* ---------- boot ---------- */
if (!TOKEN) S.tab = 'board';
render();
loadAll();
})();
</script>
